[workspace]
members = ["crates/vibe-check"]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
ast-grep-core = { version = "=0.44.1", default-features = false, features = ["tree-sitter"] }
ast-grep-language = { version = "=0.44.1", default-features = false, features = ["tree-sitter-go", "tree-sitter-python", "tree-sitter-rust", "tree-sitter-typescript"] }
clap = { version = "4.5.40", default-features = false, features = ["std", "help", "usage"] }
cpd-finder = "=0.1.8"
ignore = "0.4.27"
jsonschema = { version = "0.46.5", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokei = { version = "14.0.0", default-features = false }
